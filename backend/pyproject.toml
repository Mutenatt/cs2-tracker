[project]
name = "cs2tracker"
version = "0.1.0"
description = "Panel de estadisticas de CS2 a partir de demos .dem"
requires-python = ">=3.11"
dependencies = [
    "demoparser2>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "selectolax>=0.3",
    "pillow>=10",
    "imageio-ffmpeg>=0.5",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
cs2-ingest = "cs2tracker.ingest:main"
cs2-api = "cs2tracker.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
